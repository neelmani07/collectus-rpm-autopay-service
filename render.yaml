services:
  - type: web
    name: collectus-rpm-autopay-service
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: USE_MOCK_AI
        value: "true"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_PATH
        value: /tmp/smart_charge.db
